name: Suzuki LDDD kernel diagnostic

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_ldd_kernel_diagnostic.py'
      - '.github/workflows/suzuki-ldd-kernel-diagnostic.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run LDDD kernel diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_ldd_kernel_diagnostic.py | tee /tmp/ldd-kernel-diagnostic.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ldd-kernel-diagnostic
          path: /tmp/ldd-kernel-diagnostic.txt
