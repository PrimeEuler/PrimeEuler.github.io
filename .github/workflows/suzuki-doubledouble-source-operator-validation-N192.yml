name: Suzuki double-double source operator validation N192

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/suzuki-doubledouble-source-operator-validation-N192.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Validate DD source operator through N192
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_doubledouble_source_operator_validation.py --max-mode 192 --dps 120 | tee /tmp/dd-source-operator-validation-N192.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dd-source-operator-validation-N192
          path: /tmp/dd-source-operator-validation-N192.txt
