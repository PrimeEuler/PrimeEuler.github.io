name: Suzuki M8000 actual near shell energy

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_actual_near_shell_energy_ldd.py'
      - '.github/workflows/suzuki-M8000-actual-near-shell-energy.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run direct near-shell energy replay
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_actual_near_shell_energy_ldd.py | tee /tmp/M8000-actual-near-shell-energy.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-actual-near-shell-energy
          path: |
            /tmp/M8000-actual-near-shell-energy.txt
            unified/discriminant-12-return/research-notes/M8000_actual_near_shell_energy_ldd_result.json
