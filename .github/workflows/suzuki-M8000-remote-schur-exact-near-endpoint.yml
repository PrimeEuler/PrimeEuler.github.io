name: Suzuki M8000 exact-near remote Schur endpoint

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_remote_schur_exact_near_endpoint.py'
      - '.github/workflows/suzuki-M8000-remote-schur-exact-near-endpoint.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run exact-near endpoint replay
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_remote_schur_exact_near_endpoint.py --sector ${{ matrix.sector }} --rmax 16000 | tee /tmp/exact-near-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remote-schur-exact-near-${{ matrix.sector }}
          path: |
            /tmp/exact-near-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M8000_remote_schur_exact_near_endpoint_result.json
