name: Suzuki M8000 embedded capacity arch200

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_embedded_p4_ldd_capacity_arch200.py'
      - '.github/workflows/suzuki-M8000-embedded-capacity-arch200.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run M8000 arch200 capacity replay
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_embedded_p4_ldd_capacity_arch200.py | tee /tmp/M8000-capacity-arch200.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-capacity-arch200
          path: |
            /tmp/M8000-capacity-arch200.txt
            unified/discriminant-12-return/research-notes/M8000_embedded_p4_ldd_capacity_arch200_result.json
