name: Suzuki M64000 paired Schur K diagnostic

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M64000_paired_schur_K_diagnostic.py'
      - '.github/workflows/suzuki-M64000-paired-schur-K-diagnostic.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run paired Schur K and export protected anchor
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python - "${{ matrix.sector }}" <<'PY' | tee /tmp/M64000-schur-K-${{ matrix.sector }}.txt
          import sys,json
          from pathlib import Path
          import mpmath as mp
          import suzuki_M64000_paired_schur_K_diagnostic as base
          sector=sys.argv[1]
          row=base.one(sector,export_anchor=True)
          out=row.pop("anchor_export")
          out.update({
            "sector":sector,
            "K_total":row["K_total"],
            "protected_S_min":row["protected_S_min"],
            "target_ldd_residual_after":row["target_ldd_residual_after"],
            "graph_ldd_residual_after":row["graph_ldd_residual_after"],
            "guardrail":"exact final S,b,h exported directly by the audited M64000 producer"
          })
          with mp.workdps(base.DPS):
              kerr=abs(mp.mpf(out["K_reconstructed"])-mp.mpf(row["K_total"]))
              merr=abs(mp.mpf(out["protected_S_min_reconstructed"])-mp.mpf(row["protected_S_min"]))
              out["K_consistency_abs"]=mp.nstr(kerr,40)
              out["Smin_consistency_abs"]=mp.nstr(merr,40)
              if kerr > mp.mpf("1e-60") or merr > mp.mpf("1e-45"):
                  raise RuntimeError(("anchor self-check failed",sector,kerr,merr))
          Path(f"M64000_paired_schur_anchor_{sector}.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          print("ANCHOR_EXPORT")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M64000-schur-K-${{ matrix.sector }}
          path: |
            /tmp/M64000-schur-K-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M64000_paired_schur_anchor_${{ matrix.sector }}.json
