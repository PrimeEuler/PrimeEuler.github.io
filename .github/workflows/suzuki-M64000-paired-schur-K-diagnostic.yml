name: Suzuki M64000 paired Schur K diagnostic

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M64000_paired_schur_K_diagnostic.py'
      - '.github/workflows/suzuki-M64000-paired-schur-K-diagnostic.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run paired Schur K and export protected anchor
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python - "${{ matrix.sector }}" <<'PY' | tee /tmp/M64000-schur-K-${{ matrix.sector }}.txt
          import sys,json
          from pathlib import Path
          import mpmath as mp
          import suzuki_M64000_paired_schur_K_diagnostic as base
          sector=sys.argv[1]
          captured=[]
          orig=base.dd_matrix_to_mp
          def cap(hi,lo):
              M=orig(hi,lo)
              captured.append(M.copy())
              return M
          base.dd_matrix_to_mp=cap
          row=base.one(sector)
          S0=next(M for M in captured if M.rows==6 and M.cols==6)
          b=next(M for M in captured if M.rows==6 and M.cols==1)
          hM=next(M for M in captured if M.rows==1 and M.cols==1)
          S=(S0+S0.T)/2
          with mp.workdps(base.DPS):
              x=mp.lu_solve(S,b)
              out={
                "sector":sector,
                "S":[[mp.nstr(S[i,j],90) for j in range(6)] for i in range(6)],
                "b":[mp.nstr(b[i,0],90) for i in range(6)],
                "h":mp.nstr(hM[0,0],90),
                "Sinv_b":[mp.nstr(x[i,0],90) for i in range(6)],
                "K_total":row["K_total"],
                "protected_S_min":row["protected_S_min"],
                "target_ldd_residual_after":row["target_ldd_residual_after"],
                "graph_ldd_residual_after":row["graph_ldd_residual_after"],
                "guardrail":"same audited M64000 producer; workflow only exports captured reduced matrices"
              }
          Path(f"M64000_paired_schur_anchor_{sector}.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n"
          )
          print("ANCHOR_EXPORT")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: M64000-schur-K-${{ matrix.sector }}
          path: |
            /tmp/M64000-schur-K-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M64000_paired_schur_anchor_${{ matrix.sector }}.json
