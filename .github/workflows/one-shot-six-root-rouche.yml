name: One-shot six-root Rouche certificate
on:
  pull_request:
    paths:
      - 'unified/discriminant-12-return/research-notes/.trigger-six-root-rouche'
      - '.github/workflows/one-shot-six-root-rouche.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy mpmath
      - name: Run final six-root Rouche certificate
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_full_six_root_rouche_certificate.py | tee /tmp/six-root-rouche.txt
      - uses: actions/upload-artifact@v4
        with:
          name: six-root-rouche-output
          path: /tmp/six-root-rouche.txt
