name: Suzuki M32000 bare exact residual bridge

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M32000_bare_exact_residual_bridge.py'
      - '.github/workflows/suzuki-M32000-bare-exact-residual-bridge.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run exact-source residual bridge
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M32000_bare_exact_residual_bridge.py --sector ${{ matrix.sector }} | tee /tmp/bare-residual-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bare-residual-${{ matrix.sector }}
          path: |
            /tmp/bare-residual-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M32000_bare_exact_residual_bridge_result.json
