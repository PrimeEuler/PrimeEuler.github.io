name: Suzuki P4 graph remote-shell replay

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_p4_graph_remote_shell_extension.py'
      - '.github/workflows/suzuki-p4-graph-remote-shell.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Extend corrected carrier through remote shell
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_p4_graph_remote_shell_extension.py | tee /tmp/p4-graph-remote-shell.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p4-graph-remote-shell
          path: |
            /tmp/p4-graph-remote-shell.txt
            unified/discriminant-12-return/research-notes/p4_graph_remote_shell_extension_result.json
