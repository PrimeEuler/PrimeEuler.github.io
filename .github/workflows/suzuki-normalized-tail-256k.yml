name: Suzuki normalized 128k to 256k tail gate

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/suzuki-normalized-tail-256k.yml'
      - 'unified/discriminant-12-return/research-notes/suzuki_normalized_joint_reduction_producer.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_exact_outward_certificate.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_exact_outward_pair_certificate.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_infinite_fullq_coercivity_bridge.py'
  workflow_dispatch:

env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp10
          python -m pip install numpy scipy mpmath==1.3.0
      - name: Replay uniform full-Q constants independently of numerical certificate
        working-directory: unified/discriminant-12-return/research-notes
        run: >-
          python suzuki_infinite_fullq_coercivity_bridge.py
          --reference payloads/infinite_fullq_bridge_v14_171/infinite_fullq_bridge.json
          --output /tmp/infinite-fullq-bridge.json
      - name: Direct 256k source solve with unchanged 64k normalizer and audited finite floors
        working-directory: unified/discriminant-12-return/research-notes
        run: >-
          python suzuki_normalized_joint_reduction_producer.py
          --sector ${{ matrix.sector }} --cutoffs 256000
          --remote-start 32000 --refinements 1 --kernel exact
          --output /tmp/joint-256000-${{ matrix.sector }}.json
      - name: Replay exact represented trace witness
        working-directory: unified/discriminant-12-return/research-notes
        run: >-
          python suzuki_exact_represented_trace_certificate.py
          --witness /tmp/joint-256000-${{ matrix.sector }}.trace-256000.json.gz
          --payload /tmp/joint-256000-${{ matrix.sector }}.json
      - name: Independently replay full-vector source certificate and all targets
        working-directory: unified/discriminant-12-return/research-notes
        run: >-
          python suzuki_exact_outward_certificate.py
          --snapshot /tmp/joint-256000-${{ matrix.sector }}.trace-256000.full.zip
          --reference /tmp/joint-256000-${{ matrix.sector }}.trace-256000.full.certificate.json
          --output /tmp/replayed.json --require-targets
      - uses: actions/upload-artifact@v4
        with:
          name: normalized-tail-full-256000-${{ matrix.sector }}
          path: |
            /tmp/joint-256000-${{ matrix.sector }}.json
            /tmp/joint-256000-${{ matrix.sector }}.trace-*.json.gz
            /tmp/joint-256000-${{ matrix.sector }}.trace-*.full.zip
            /tmp/joint-256000-${{ matrix.sector }}.trace-*.full.certificate.json
            /tmp/infinite-fullq-bridge.json
          if-no-files-found: error

  paired:
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small consumer dependency
        run: python -m pip install mpmath==1.3.0
      - uses: actions/download-artifact@v4
        with:
          pattern: normalized-tail-full-256000-*
          merge-multiple: true
          path: /tmp/joint
      - name: Compose outward 128k to 256k interval against independently audited frozen 128k endpoints
        working-directory: unified/discriminant-12-return/research-notes
        run: >-
          python suzuki_exact_outward_pair_certificate.py
          --even-old payloads/exact_outward_run_37791856005/joint-128000-even-v.json
          --even-new /tmp/joint/joint-256000-even-v.json
          --odd-old payloads/exact_outward_run_37791856005/joint-128000-odd-v.json
          --odd-new /tmp/joint/joint-256000-odd-v.json
          --R 128000 --R2 256000
          --output /tmp/exact-outward-pair-128000-256000.json --require-budget
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normalized-tail-pair-128000-256000
          path: /tmp/exact-outward-pair-128000-256000.json
          if-no-files-found: error
