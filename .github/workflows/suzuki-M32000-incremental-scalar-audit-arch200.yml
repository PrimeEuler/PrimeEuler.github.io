name: Suzuki M32000 incremental scalar interval audit arch200

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M32000_scalar_interval_incremental_arch200.py'
      - '.github/workflows/suzuki-M32000-incremental-scalar-audit-arch200.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run incremental scalar interval audit
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M32000_scalar_interval_incremental_arch200.py | tee /tmp/scalar-16k32k.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scalar-interval-16k32k
          path: |
            /tmp/scalar-16k32k.txt
            unified/discriminant-12-return/research-notes/M32000_scalar_interval_incremental_arch200_result.json
