name: Suzuki reduced parallel source bound diagnostic

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_reduced_parallel_source_bound_diagnostic.py'
      - '.github/workflows/suzuki-reduced-parallel-source-bound-diagnostic.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run reduced parallel-source diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_reduced_parallel_source_bound_diagnostic.py --sector ${{ matrix.sector }} | tee /tmp/reduced-parallel-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reduced-parallel-${{ matrix.sector }}
          path: /tmp/reduced-parallel-${{ matrix.sector }}.txt
