name: Suzuki bulk-subtracted resonance extended

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/suzuki-bulk-resonance-extended.yml'
  workflow_dispatch:

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        max_mode: [160, 192]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run audited bulk-subtracted resonance extension
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_form_core_bulk_subtracted_resonance.py --max-mode ${{ matrix.max_mode }} --dps 70 | tee /tmp/bulk-resonance-${{ matrix.max_mode }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bulk-resonance-${{ matrix.max_mode }}
          path: /tmp/bulk-resonance-${{ matrix.max_mode }}.txt
