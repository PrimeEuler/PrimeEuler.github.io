name: Suzuki source-capacity core crossing

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_source_capacity_core_crossing_diagnostic.py'
      - '.github/workflows/suzuki-source-capacity-core-crossing.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run source-capacity core-crossing diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_source_capacity_core_crossing_diagnostic.py --max-mode 192 --dps 70 | tee /tmp/source-capacity-core-crossing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-capacity-core-crossing
          path: |
            /tmp/source-capacity-core-crossing.txt
            unified/discriminant-12-return/research-notes/source_capacity_core_crossing_result.json
