name: Suzuki M8000 mu1 protected outward certificate

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_mu1_protected_outward_certificate.py'
      - '.github/workflows/suzuki-M8000-mu1-protected-outward-certificate.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run protected outward certificate budget
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_mu1_protected_outward_certificate.py | tee /tmp/M8000-mu1-protected-outward-certificate.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-mu1-protected-outward-certificate
          path: |
            /tmp/M8000-mu1-protected-outward-certificate.txt
            unified/discriminant-12-return/research-notes/M8000_mu1_protected_outward_certificate_result.json
