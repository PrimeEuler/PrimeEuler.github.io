name: Suzuki reduced Feshbach Gram outward budget

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_reduced_feshbach_gram_outward_budget.py'
      - '.github/workflows/suzuki-reduced-feshbach-gram-outward-budget.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
        R: [64000, 128000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run reduced Gram outward budget
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          EXTRA=()
          if [ "${{ matrix.R }}" = "64000" ]; then
            rm -rf /tmp/corrected-anchor
            mkdir -p /tmp/corrected-anchor
            gh run download 37659896312 \
              -n M64000-schur-K-${{ matrix.sector }} \
              -D /tmp/corrected-anchor
            ANCHOR_LOG="$(find /tmp/corrected-anchor -type f -name 'M64000-schur-K-${{ matrix.sector }}.txt' -print -quit)"
            test -n "$ANCHOR_LOG"
            EXTRA=(--anchor-log "$ANCHOR_LOG")
          fi
          python suzuki_reduced_feshbach_gram_outward_budget.py \
            --sector ${{ matrix.sector }} --R ${{ matrix.R }} "${EXTRA[@]}" \
            | tee /tmp/reduced-gram-${{ matrix.sector }}-${{ matrix.R }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reduced-gram-${{ matrix.sector }}-${{ matrix.R }}
          path: /tmp/reduced-gram-${{ matrix.sector }}-${{ matrix.R }}.txt
