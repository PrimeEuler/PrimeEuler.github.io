name: Suzuki double-double source operator validation

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_doubledouble_source_operator.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_doubledouble_source_operator_validation.py'
      - '.github/workflows/suzuki-doubledouble-source-operator-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Validate DD source operator
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_doubledouble_source_operator_validation.py --max-mode 32 --dps 120 | tee /tmp/dd-source-operator-validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dd-source-operator-validation
          path: /tmp/dd-source-operator-validation.txt
