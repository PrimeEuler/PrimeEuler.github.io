name: Suzuki cross-octave operator cap

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_cross_octave_operator_cap.py'
      - '.github/workflows/suzuki-cross-octave-operator-cap.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run analytic cross-octave cap
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_cross_octave_operator_cap.py | tee /tmp/cross-octave-cap.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cross-octave-cap
          path: /tmp/cross-octave-cap.txt
