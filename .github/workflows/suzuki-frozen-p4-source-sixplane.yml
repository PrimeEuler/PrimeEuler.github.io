name: Suzuki frozen P4 source six-plane alignment

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_frozen_p4_source_sixplane_alignment.py'
      - '.github/workflows/suzuki-frozen-p4-source-sixplane.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run frozen P4 alignment diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_frozen_p4_source_sixplane_alignment.py --max-mode 192 --dps 80 | tee /tmp/frozen-p4-sixplane.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-p4-source-sixplane
          path: |
            /tmp/frozen-p4-sixplane.txt
            unified/discriminant-12-return/research-notes/frozen_p4_source_sixplane_alignment_result.json
