name: Suzuki M64000 incremental scalar interval audit arch200

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M64000_scalar_interval_incremental_arch200.py'
      - '.github/workflows/suzuki-M64000-incremental-scalar-audit-arch200.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run incremental scalar audit through 64k
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M64000_scalar_interval_incremental_arch200.py --sector ${{ matrix.sector }} | tee /tmp/scalar64-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scalar64-${{ matrix.sector }}
          path: |
            /tmp/scalar64-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M64000_scalar_interval_incremental_arch200_result.json
