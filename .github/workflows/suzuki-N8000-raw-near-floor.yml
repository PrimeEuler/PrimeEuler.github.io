name: Suzuki N8000 raw near floor

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N8000_raw_near_floor_certificate.py'
      - '.github/workflows/suzuki-N8000-raw-near-floor.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mpmath
        run: python -m pip install --upgrade mpmath
      - name: Run raw near-floor interval certificate
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_N8000_raw_near_floor_certificate.py
