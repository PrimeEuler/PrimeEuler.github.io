name: Suzuki M8000 native LDDD near shell

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_actual_near_shell_energy_native_ldd.py'
      - '.github/workflows/suzuki-M8000-native-near-shell.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run native LDDD near-shell replay
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_actual_near_shell_energy_native_ldd.py --sector ${{ matrix.sector }} | tee /tmp/native-near-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: native-near-${{ matrix.sector }}
          path: |
            /tmp/native-near-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M8000_actual_near_shell_energy_native_ldd_result.json
