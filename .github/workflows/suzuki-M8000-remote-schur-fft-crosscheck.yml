name: Suzuki M8000 remote Schur FFT 16000 crosscheck

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/suzuki-M8000-remote-schur-fft-crosscheck.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run M8000 remote Schur at known M16000 endpoint
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_remote_schur_fft_diagnostic.py --sector ${{ matrix.sector }} --rmax 16000 | tee /tmp/remote-schur-16k-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remote-schur-16k-${{ matrix.sector }}
          path: |
            /tmp/remote-schur-16k-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M8000_remote_schur_fft_diagnostic_result.json
