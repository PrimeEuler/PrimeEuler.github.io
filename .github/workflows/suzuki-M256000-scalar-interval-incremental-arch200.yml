name: Suzuki M256000 scalar interval incremental arch200

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M256000_scalar_interval_incremental_arch200.py'
      - '.github/workflows/suzuki-M256000-scalar-interval-incremental-arch200.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run M256000 scalar interval extension
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M256000_scalar_interval_incremental_arch200.py --sector ${{ matrix.sector }} | tee /tmp/m256000-scalar-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m256000-scalar-${{ matrix.sector }}
          path: |
            /tmp/m256000-scalar-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M256000_scalar_interval_incremental_arch200_result.json
