name: Suzuki M8000 M16000 capacity ratio sensitivity

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_M16000_capacity_ratio_source_sensitivity.py'
      - '.github/workflows/suzuki-M8000-M16000-capacity-ratio-sensitivity.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run outer finite common-mode sensitivity
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_M16000_capacity_ratio_source_sensitivity.py --sector ${{ matrix.sector }} | tee /tmp/cap-ratio-8k16k-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: capacity-ratio-8k16k-${{ matrix.sector }}
          path: |
            /tmp/cap-ratio-8k16k-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M8000_M16000_capacity_ratio_source_sensitivity_result.json
