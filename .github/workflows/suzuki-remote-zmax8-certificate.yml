name: Suzuki remote Zmax8 certificate

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_remote_zmax8_certificate.py'
      - '.github/workflows/suzuki-remote-zmax8-certificate.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mpmath
        run: python -m pip install --upgrade pip mpmath
      - name: Run remote Zmax8 certificate
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_remote_zmax8_certificate.py
