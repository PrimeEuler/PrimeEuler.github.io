name: Suzuki P4 self-consistent moment Ritz gate

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_p4_self_consistent_moment_reritz.py'
      - '.github/workflows/suzuki-p4-self-consistent-moment.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run self-consistent moment Ritz gate
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_p4_self_consistent_moment_reritz.py | tee /tmp/p4-self-consistent-moment.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p4-self-consistent-moment
          path: |
            /tmp/p4-self-consistent-moment.txt
            unified/discriminant-12-return/research-notes/p4_self_consistent_moment_reritz_result.json
