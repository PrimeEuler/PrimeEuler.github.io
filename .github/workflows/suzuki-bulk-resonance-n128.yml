name: Suzuki bulk-subtracted resonance N128

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/suzuki-bulk-resonance-n128.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run audited bulk-subtracted resonance code at N=128
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_form_core_bulk_subtracted_resonance.py --max-mode 128 --dps 70 | tee /tmp/bulk-resonance-n128.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bulk-resonance-n128
          path: /tmp/bulk-resonance-n128.txt
