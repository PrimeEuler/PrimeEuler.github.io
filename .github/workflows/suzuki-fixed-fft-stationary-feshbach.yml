name: Suzuki fixed FFT stationary Feshbach calibration

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_fixed_fft_stationary_feshbach.py'
      - '.github/workflows/suzuki-fixed-fft-stationary-feshbach.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run 8k/16k stationary-Feshbach calibration
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_fixed_fft_stationary_feshbach.py --sector ${{ matrix.sector }} --cuts 8000,16000 | tee /tmp/stationary-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: stationary-feshbach-${{ matrix.sector }}
          path: |
            /tmp/stationary-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/fixed_fft_stationary_feshbach_result.json
