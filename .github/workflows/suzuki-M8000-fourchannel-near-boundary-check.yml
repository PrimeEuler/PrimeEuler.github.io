name: Suzuki M8000 fourchannel near-boundary check

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_fourchannel_near_boundary_check.py'
      - '.github/workflows/suzuki-M8000-fourchannel-near-boundary-check.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run adversarial near-boundary check
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_fourchannel_near_boundary_check.py | tee /tmp/M8000-fourchannel-near-boundary-check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-fourchannel-near-boundary-check
          path: |
            /tmp/M8000-fourchannel-near-boundary-check.txt
            unified/discriminant-12-return/research-notes/M8000_fourchannel_near_boundary_check_result.json
