name: Suzuki N4000 normalized far residual constant

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N4000_normalized_far_residual_constant.py'
      - '.github/workflows/suzuki-N4000-normalized-far-residual-constant.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run N4000 normalized far residual constant diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_N4000_normalized_far_residual_constant.py | tee /tmp/N4000-normalized-far-residual-constant.txt
      - uses: actions/upload-artifact@v4
        with:
          name: N4000-normalized-far-residual-constant
          path: |
            /tmp/N4000-normalized-far-residual-constant.txt
            unified/discriminant-12-return/research-notes/N4000_normalized_far_residual_constant_result.json
