name: Suzuki wider lift Front Near far moments replay
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-wider-front-near-far.yml
      - unified/discriminant-12-return/research-notes/suzuki_wider_lift_front_near_far_action.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-moment-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact convolution dependency
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Reconstruct hash-bound actual256 witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil
          from pathlib import Path
          root=Path('payloads/exact_outward_run_37827949740')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for x in manifest['files']:
              raw=(root/x['file']).read_bytes()
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
          target=Path('/tmp/full-stationary-input');target.mkdir()
          for x in manifest['snapshots']:
              if x['cutoff']!=256000:continue
              raw=base64.b64decode(b''.join((root/p).read_bytes() for p in x['base64_parts']),validate=True)
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              (target/x['snapshot_file']).write_bytes(raw)
              shutil.copyfile(root/x['certificate_file'],target/x['certificate_file'])
          for short in ('even','odd'):
              for kind in ('moments','far'):
                  name=f'frozen256-{short}-{kind}.json'
                  shutil.copyfile(root/name,target/name)
          Path('/tmp/full-stationary-results').mkdir()
          PY
      - name: Recompute every retained moment and complete direct far checks
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          for sector in even-v odd-v; do
            python suzuki_wider_lift_front_near_far_action.py --root /tmp/full-stationary-input --rhs-root payloads/refined_near_trial_and_lift_v14_300 --lift-root payloads/wider_correction_rhs_and_lift_v14_345 --source-root payloads/full_stationary_source_v14_213 --sector "$sector" --output "/tmp/full-stationary-results/wider-front-near-far-$sector.json"
            cmp "/tmp/full-stationary-results/wider-front-near-far-$sector.json" "payloads/wider_front_near_far_v14_352/wider-front-near-far-$sector.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wider-front-near-far-moments
          path: /tmp/full-stationary-results
          if-no-files-found: error
