name: Suzuki plus-minus-i relative row tail

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_pm_i_relative_row_tail_certificate.py'
      - '.github/workflows/suzuki-pm-i-relative-row-tail.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run relative-row tail certificate
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_pm_i_relative_row_tail_certificate.py
