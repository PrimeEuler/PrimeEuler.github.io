name: Suzuki fixed FFT capacity-only 32k 64k

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_full_fft_fixed_capacity_extended.py'
      - '.github/workflows/suzuki-full-fft-capacity-only-32k64k.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
        cutoff: [32000, 64000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run capacity-only extended point
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_full_fft_fixed_capacity_extended.py --sector ${{ matrix.sector }} --cutoff ${{ matrix.cutoff }} | tee /tmp/cap-${{ matrix.sector }}-${{ matrix.cutoff }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-capacity-${{ matrix.sector }}-${{ matrix.cutoff }}
          path: |
            /tmp/cap-${{ matrix.sector }}-${{ matrix.cutoff }}.txt
            unified/discriminant-12-return/research-notes/M_full_fft_fixed_capacity_extended_result.json
