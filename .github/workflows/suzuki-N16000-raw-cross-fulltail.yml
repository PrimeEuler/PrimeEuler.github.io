name: Suzuki N16000 raw cross fulltail

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N16000_raw_cross_fulltail_diagnostic.py'
      - '.github/workflows/suzuki-N16000-raw-cross-fulltail.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run N16000 full-tail raw cross diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_N16000_raw_cross_fulltail_diagnostic.py --sector ${{ matrix.sector }} | tee /tmp/N16000-raw-cross-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: N16000-raw-cross-${{ matrix.sector }}
          path: |
            /tmp/N16000-raw-cross-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/N16000_raw_cross_fulltail_diagnostic_result.json
