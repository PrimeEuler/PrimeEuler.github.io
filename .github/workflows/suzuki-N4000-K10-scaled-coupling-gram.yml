name: Suzuki N4000 K10 scaled coupling Gram

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N4000_K10_scaled_coupling_gram.py'
      - '.github/workflows/suzuki-N4000-K10-scaled-coupling-gram.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run scaled K10 coupling Gram
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_N4000_K10_scaled_coupling_gram.py --sector ${{ matrix.sector }} | tee /tmp/K10-scaled-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: K10-scaled-coupling-${{ matrix.sector }}
          path: |
            /tmp/K10-scaled-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/N4000_K10_scaled_coupling_gram_result.json
