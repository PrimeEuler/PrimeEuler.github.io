name: Suzuki residual Near seed refinement
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-residual-near-seed-refinement.yml
      - unified/discriminant-12-return/research-notes/suzuki_residual_near_seed_refinement.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-refinement-RHS:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact convolution dependency
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Reconstruct hash-bound actual256 witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil
          from pathlib import Path
          root=Path('payloads/exact_outward_run_37827949740')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for x in manifest['files']:
              raw=(root/x['file']).read_bytes()
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
          target=Path('/tmp/refinement-input/actual256');target.mkdir(parents=True)
          for x in manifest['snapshots']:
              if x['cutoff']!=256000:continue
              raw=base64.b64decode(b''.join((root/p).read_bytes() for p in x['base64_parts']),validate=True)
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              (target/x['snapshot_file']).write_bytes(raw)
              shutil.copyfile(root/x['certificate_file'],target/x['certificate_file'])
          for short in ('even','odd'):
              for kind in ('moments','far'):
                  name=f'frozen256-{short}-{kind}.json'
                  shutil.copyfile(root/name,target/name)
          Path('/tmp/full-stationary-results').mkdir()
          PY
      - name: Rebuild the exact rejected residual and evaluate the correction
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          ln -s "$PWD/payloads/near_trial_rhs_witness_v14_238" /tmp/refinement-input/near_trial_rhs_witness_v14_238
          ln -s "$PWD/payloads/infinite_seed_rhs_witness_v14_268" /tmp/refinement-input/infinite_seed_rhs_witness_v14_268
          for sector in even-v odd-v; do
            python suzuki_infinite_seed_region1_residual.py --compact-root payloads/infinite_seed_compact_near_middle_v14_285 --tail-root payloads/infinite_seed_region1_composed_action_v14_294 --lift-root payloads/infinite_seed_finite_lift_witness_v14_269 --source-root payloads/full_stationary_source_v14_213 --sector "$sector" --output-root /tmp/rebuilt-region1-residual
            cmp "payloads/infinite_seed_region1_residual_v14_297/region1-residual-$sector.json" "/tmp/rebuilt-region1-residual/region1-residual-$sector.json"
            python suzuki_residual_near_seed_refinement.py --payload-root /tmp/refinement-input --residual-root /tmp/rebuilt-region1-residual --output-root /tmp/near-refinement --sector "$sector"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-residual-near-refinement
          path: /tmp/near-refinement
          if-no-files-found: error

