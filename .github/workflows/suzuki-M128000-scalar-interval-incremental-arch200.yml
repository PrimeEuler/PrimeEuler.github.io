name: Suzuki M128000 scalar interval incremental arch200

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M128000_scalar_interval_incremental_arch200.py'
      - '.github/workflows/suzuki-M128000-scalar-interval-incremental-arch200.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run M128000 scalar interval extension
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M128000_scalar_interval_incremental_arch200.py --sector ${{ matrix.sector }} | tee /tmp/m128000-scalar-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m128000-scalar-${{ matrix.sector }}
          path: |
            /tmp/m128000-scalar-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M128000_scalar_interval_incremental_arch200_result.json
