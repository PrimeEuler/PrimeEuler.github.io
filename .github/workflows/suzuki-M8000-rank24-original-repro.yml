name: Suzuki M8000 rank24 original reproducibility

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_near_rank24_feshbach.py'
      - '.github/workflows/suzuki-M8000-rank24-original-repro.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run original rank24 producer
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_near_rank24_feshbach.py --sector ${{ matrix.sector }} | tee /tmp/rank24-original-${{ matrix.sector }}-${{ matrix.repeat }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rank24-original-${{ matrix.sector }}-${{ matrix.repeat }}
          path: /tmp/rank24-original-${{ matrix.sector }}-${{ matrix.repeat }}.txt
