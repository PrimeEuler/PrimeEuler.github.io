name: Suzuki M8000 exact odd M16000 boundary crosscheck

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_remote_schur_16000_exact_boundary.py'
      - '.github/workflows/suzuki-M8000-remote-schur-16000-exact-boundary.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run exact-boundary crosscheck
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_remote_schur_16000_exact_boundary.py --sector odd-v --rmax 16000 | tee /tmp/exact-boundary-odd-v.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remote-schur-16k-odd-v-exact-boundary
          path: |
            /tmp/exact-boundary-odd-v.txt
            unified/discriminant-12-return/research-notes/M8000_remote_schur_16000_exact_boundary_result.json
