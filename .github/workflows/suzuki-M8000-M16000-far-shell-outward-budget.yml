name: Suzuki M8000 M16000 far shell outward budget

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_M16000_far_shell_outward_budget.py'
      - '.github/workflows/suzuki-M8000-M16000-far-shell-outward-budget.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run finite far-shell budget
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_M16000_far_shell_outward_budget.py | tee /tmp/far-shell-budget.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-M16000-far-shell-budget
          path: /tmp/far-shell-budget.txt
