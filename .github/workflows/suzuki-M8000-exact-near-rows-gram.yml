name: Suzuki M8000 exact near rows Gram

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_mu1_exact_near_rows_gram.py'
      - '.github/workflows/suzuki-M8000-exact-near-rows-gram.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run exact near-row correlated Gram diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_mu1_exact_near_rows_gram.py | tee /tmp/M8000-exact-near-rows-gram.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-exact-near-rows-gram
          path: |
            /tmp/M8000-exact-near-rows-gram.txt
            unified/discriminant-12-return/research-notes/M8000_mu1_exact_near_rows_gram_result.json
