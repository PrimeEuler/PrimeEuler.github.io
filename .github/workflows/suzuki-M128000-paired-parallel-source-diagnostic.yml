name: Suzuki M128000 paired parallel source diagnostic

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M128000_paired_parallel_source_diagnostic.py'
      - '.github/workflows/suzuki-M128000-paired-parallel-source-diagnostic.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run paired parallel-source diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M128000_paired_parallel_source_diagnostic.py | tee /tmp/paired-parallel-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: paired-parallel-source
          path: /tmp/paired-parallel-source.txt
