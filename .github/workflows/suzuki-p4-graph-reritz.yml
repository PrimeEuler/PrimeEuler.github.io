name: Suzuki P4 graph-corrected reritz replay

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_p4_graph_corrected_reritz_replay.py'
      - '.github/workflows/suzuki-p4-graph-reritz.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Re-Ritz graph-corrected carrier
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_p4_graph_corrected_reritz_replay.py | tee /tmp/p4-graph-reritz.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p4-graph-corrected-reritz
          path: |
            /tmp/p4-graph-reritz.txt
            unified/discriminant-12-return/research-notes/p4_graph_corrected_reritz_result.json
