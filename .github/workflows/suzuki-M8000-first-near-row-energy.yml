name: Suzuki M8000 first near row energy

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_mu1_first_near_row_energy.py'
      - '.github/workflows/suzuki-M8000-first-near-row-energy.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run first near-row energy gate
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_mu1_first_near_row_energy.py | tee /tmp/M8000-first-near-row-energy.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-first-near-row-energy
          path: |
            /tmp/M8000-first-near-row-energy.txt
            unified/discriminant-12-return/research-notes/M8000_mu1_first_near_row_energy_result.json
