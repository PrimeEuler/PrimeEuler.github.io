name: Suzuki M3999 LDDD refined capacity bracket

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/suzuki-M3999-ldd-refined-capacity-bracket.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run M3999/4000 LDDD refinement bracket
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_ldd_refined_capacity_bracket.py --max-mode 4000 --dps 180 --refinements 1 | tee /tmp/M3999-ldd-refined-capacity-bracket.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M3999-ldd-refined-capacity-bracket
          path: |
            /tmp/M3999-ldd-refined-capacity-bracket.txt
            unified/discriminant-12-return/research-notes/ldd_refined_capacity_bracket_result.json
