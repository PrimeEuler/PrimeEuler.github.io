name: Suzuki embedded P4 capacity extension arch200

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_embedded_p4_ldd_capacity_extension_arch200.py'
      - '.github/workflows/suzuki-embedded-p4-capacity-extension-arch200.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target: [12000, 16000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run arch200 cutoff extension
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_embedded_p4_ldd_capacity_extension_arch200.py --target-max ${{ matrix.target }} | tee /tmp/embedded-p4-arch200-M${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-p4-arch200-M${{ matrix.target }}
          path: |
            /tmp/embedded-p4-arch200-M${{ matrix.target }}.txt
            unified/discriminant-12-return/research-notes/embedded_p4_ldd_capacity_arch200_M${{ matrix.target }}_result.json
