name: Suzuki N4000 K10 moment residual certificate target

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N4000_K10_moment_residual_certificate_target.py'
      - '.github/workflows/suzuki-N4000-K10-moment-residual-certificate-target.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run N4000 K10 moment residual target
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_N4000_K10_moment_residual_certificate_target.py | tee /tmp/N4000-K10-moment-residual-target.txt
      - uses: actions/upload-artifact@v4
        with:
          name: N4000-K10-moment-residual-target
          path: |
            /tmp/N4000-K10-moment-residual-target.txt
            unified/discriminant-12-return/research-notes/N4000_K10_moment_residual_certificate_target_result.json
