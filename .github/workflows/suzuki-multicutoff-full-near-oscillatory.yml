name: Suzuki multicutoff full-near FFT oscillatory

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/osc_full_near_fft_multicutoff.py'
      - '.github/workflows/suzuki-multicutoff-full-near-oscillatory.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run multicutoff full-near diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python osc_full_near_fft_multicutoff.py --N 64000 128000 | tee /tmp/multicutoff-full-near-osc.txt
      - uses: actions/upload-artifact@v4
        with:
          name: multicutoff-full-near-osc
          path: /tmp/multicutoff-full-near-osc.txt
