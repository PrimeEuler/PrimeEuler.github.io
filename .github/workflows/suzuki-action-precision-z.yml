name: Suzuki action precision scalar replay
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/suzuki-action-precision-z.yml'
      - 'unified/discriminant-12-return/research-notes/suzuki_action_precision_z_gate.py'
      - 'unified/discriminant-12-return/research-notes/payloads/action_precision_z_v14_229/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  action-scalar-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent diagnostic dependency
        run: python -m pip install mpmath==1.3.0
      - name: Replay default source mode without changing its frozen bytes
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_certified_remote_z_gate.py \
            --source payloads/whole_affine_source_v14_223/whole-source-affine.json \
            --output /tmp/default-z-regression.json
          cmp payloads/certified_remote_z_v14_227/certified-remote-z-gate.json /tmp/default-z-regression.json
      - name: Action precision physical intervals and exact operator charge
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_action_precision_z_gate.py \
            --source-gate payloads/certified_remote_z_v14_227/certified-remote-z-gate.json \
            --output /tmp/action-precision-z-gate.json
          cmp payloads/action_precision_z_v14_229/action-precision-z-gate.json /tmp/action-precision-z-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: action-precision-z-replay
          path: /tmp/action-precision-z-gate.json
          if-no-files-found: error
