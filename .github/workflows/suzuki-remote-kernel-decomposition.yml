name: Suzuki remote kernel decomposition

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_remote_kernel_decomposition_diagnostic.py'
      - '.github/workflows/suzuki-remote-kernel-decomposition.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run remote kernel decomposition diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_remote_kernel_decomposition_diagnostic.py | tee /tmp/remote-kernel-decomposition.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remote-kernel-decomposition
          path: |
            /tmp/remote-kernel-decomposition.txt
            unified/discriminant-12-return/research-notes/remote_kernel_decomposition_diagnostic_result.json
