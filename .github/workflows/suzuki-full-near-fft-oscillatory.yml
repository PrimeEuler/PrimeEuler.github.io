name: Suzuki full-near FFT oscillatory diagnostic

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/osc_full_near_fft_diagnostic.py'
      - '.github/workflows/suzuki-full-near-fft-oscillatory.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run full-near FFT diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python osc_full_near_fft_diagnostic.py --J 300 1000 4000 16000 | tee /tmp/full-near-osc.txt
      - uses: actions/upload-artifact@v4
        with:
          name: full-near-osc
          path: /tmp/full-near-osc.txt
