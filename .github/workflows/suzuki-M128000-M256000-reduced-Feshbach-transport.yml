name: Suzuki M128000 M256000 reduced Feshbach transport

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M128000_M256000_reduced_feshbach_transport.py'
      - '.github/workflows/suzuki-M128000-M256000-reduced-Feshbach-transport.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run reduced Feshbach transport
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M128000_M256000_reduced_feshbach_transport.py --sector ${{ matrix.sector }} | tee /tmp/reduced-feshbach-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reduced-feshbach-${{ matrix.sector }}
          path: /tmp/reduced-feshbach-${{ matrix.sector }}.txt
