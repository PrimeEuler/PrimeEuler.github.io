name: Suzuki new finite lift producer and exact replay
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/suzuki-new-finite-lift.yml'
      - 'unified/discriminant-12-return/research-notes/suzuki_new_finite_lift.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  new-finite-lift-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent reference dependency
        run: python -m pip install mpmath==1.3.0 numpy scipy
      - name: Install exact convolution dependency
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Reconstruct hash-bound actual256 witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil
          from pathlib import Path
          root=Path('payloads/exact_outward_run_37827949740')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for x in manifest['files']:
              raw=(root/x['file']).read_bytes()
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
          target=Path('/tmp/full-stationary-input');target.mkdir()
          for x in manifest['snapshots']:
              if x['cutoff']!=256000:continue
              raw=base64.b64decode(b''.join((root/p).read_bytes() for p in x['base64_parts']),validate=True)
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              (target/x['snapshot_file']).write_bytes(raw)
              shutil.copyfile(root/x['certificate_file'],target/x['certificate_file'])
          for short in ('even','odd'):
              for kind in ('moments','far'):
                  name=f'frozen256-{short}-{kind}.json'
                  shutil.copyfile(root/name,target/name)
          Path('/tmp/full-stationary-results').mkdir()
          PY
      - name: Verify immutable new trial and physical RHS archive
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import json,hashlib
          root=Path('payloads/near_trial_rhs_witness_v14_238')
          manifest=json.loads((root/'manifest.json').read_text())
          for r in manifest['files']:
              raw=(root/r['file']).read_bytes()
              assert len(raw)==r['bytes'] and hashlib.sha256(raw).hexdigest()==r['sha256']
          PYCODE
      - name: Construct both new physical finite lifts
        working-directory: unified/discriminant-12-return/research-notes
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          mkdir -p /tmp/new-finite-lifts
          python -c 'import numpy,scipy; print(numpy.__version__,scipy.__version__)'
          for sector in even-v odd-v; do
            python suzuki_new_finite_lift.py --mode produce \
              --root /tmp/full-stationary-input \
              --rhs-root payloads/near_trial_rhs_witness_v14_238 \
              --witness-root /tmp/new-finite-lifts --sector "$sector" \
              --output "/tmp/new-finite-lifts/new-finite-lift-$sector.json"
          done
      - name: Independently replay every frozen represented residual coordinate
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          for sector in even-v odd-v; do
            python suzuki_new_finite_lift.py --mode replay \
              --root /tmp/full-stationary-input \
              --rhs-root payloads/near_trial_rhs_witness_v14_238 \
              --witness-root /tmp/new-finite-lifts --sector "$sector" \
              --output "/tmp/replayed-new-finite-lift-$sector.json"
            cmp "/tmp/new-finite-lifts/new-finite-lift-$sector.json" "/tmp/replayed-new-finite-lift-$sector.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-new-finite-lifts
          path: /tmp/new-finite-lifts
          if-no-files-found: error
      - name: Freeze verified new finite lift witnesses additively
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B new-finite-lift-freeze origin/master
            echo "Archive base $(git rev-parse HEAD)"
            git ls-tree -r --name-only HEAD unified/discriminant-12-return/ledger | sort -V | tail -4 | while read path; do
              git show "HEAD:$path"
            done
            python - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          src=Path('/tmp/new-finite-lifts')
          dst=Path('unified/discriminant-12-return/research-notes/payloads/new_finite_lift_witness_v14_239')
          files=[]
          for sector in ('even-v','odd-v'):
              certname=f'new-finite-lift-{sector}.json'
              cert=json.loads((src/certname).read_text())
              names=[certname]
              for spec in [cert['lift_buffer']]:
                  name=spec['file'];raw=(src/name).read_bytes()
                  assert len(raw)==spec['bytes'] and hashlib.sha256(raw).hexdigest()==spec['sha256']
                  names.append(name)
              for filename in names:
                  raw=(src/filename).read_bytes()
                  files.append({'file':filename,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          manifest={'schema':'cone.frozen-certified-new-finite-lift.v1','source_commit':os.environ['SOURCE_COMMIT'],'files':files}
          blobs={r['file']:(src/r['file']).read_bytes() for r in files}
          blobs['manifest.json']=(json.dumps(manifest,indent=2,sort_keys=True)+'\n').encode()
          if dst.exists():
              assert {p.name for p in dst.iterdir()}==set(blobs),'archive collision'
              assert all((dst/name).read_bytes()==b for name,b in blobs.items()),'archive collision'
          else:
              dst.mkdir(parents=True)
              for name,b in blobs.items():(dst/name).write_bytes(b)
          PYCODE
            git add unified/discriminant-12-return/research-notes/payloads/new_finite_lift_witness_v14_239
            if git diff --cached --quiet; then
              echo 'Identical witness archive already frozen'
              exit 0
            fi
            git commit -m 'Freeze certified new finite lifts v14.239'
            if git push origin HEAD:master; then exit 0; fi
          done
          echo 'Nonforced archive publication failed after three HEAD refreshes'
          exit 1
