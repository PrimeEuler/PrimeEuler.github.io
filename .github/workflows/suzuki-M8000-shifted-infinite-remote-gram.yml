name: Suzuki M8000 shifted infinite remote Gram

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_shifted_shell_infinite_remote_gram.py'
      - '.github/workflows/suzuki-M8000-shifted-infinite-remote-gram.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run shifted M8000 infinite remote-Gram gate
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_shifted_shell_infinite_remote_gram.py | tee /tmp/M8000-shifted-infinite-remote-gram.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-shifted-infinite-remote-gram
          path: |
            /tmp/M8000-shifted-infinite-remote-gram.txt
            unified/discriminant-12-return/research-notes/M8000_shifted_shell_infinite_remote_gram_result.json
