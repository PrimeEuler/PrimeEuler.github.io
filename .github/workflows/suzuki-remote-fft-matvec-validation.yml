name: Suzuki remote FFT matvec validation

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_remote_fft_matvec_validation.py'
      - '.github/workflows/suzuki-remote-fft-matvec-validation.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Validate FFT remote matvec
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_remote_fft_matvec_validation.py | tee /tmp/remote-fft-matvec.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remote-fft-matvec-validation
          path: |
            /tmp/remote-fft-matvec.txt
            unified/discriminant-12-return/research-notes/remote_fft_matvec_validation_result.json
