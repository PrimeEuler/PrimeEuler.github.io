name: Suzuki M8000 protected component magnitude

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_mu1_protected_component_magnitude.py'
      - '.github/workflows/suzuki-M8000-mu1-protected-component-magnitude.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run protected component magnitude
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_mu1_protected_component_magnitude.py | tee /tmp/M8000-protected-component-magnitude.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-protected-component-magnitude
          path: |
            /tmp/M8000-protected-component-magnitude.txt
            unified/discriminant-12-return/research-notes/M8000_mu1_protected_component_magnitude_result.json
