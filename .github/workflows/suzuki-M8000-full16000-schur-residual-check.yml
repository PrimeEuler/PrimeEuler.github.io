name: Suzuki M8000 full M16000 Schur residual check

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_remote_schur_full16000_residual_check.py'
      - '.github/workflows/suzuki-M8000-full16000-schur-residual-check.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run full-solution Schur residual calibration
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_remote_schur_full16000_residual_check.py --sector ${{ matrix.sector }} | tee /tmp/full16000-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: full16000-schur-residual-${{ matrix.sector }}
          path: |
            /tmp/full16000-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/M8000_remote_schur_full16000_residual_check_result.json
