name: Evaluate supplied wider correction finite RHS
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-wider-correction-rhs.yml
      - unified/discriminant-12-return/research-notes/suzuki_wider_correction_rhs.py
      - unified/discriminant-12-return/research-notes/payloads/sandbox_wider_correction_v14_339/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supplied-wider-correction-rhs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - sector: even-v
            candidate_sha256: fdf93112802fe28ef53efa804be760a0fc17abc404993c8b2af6c33b1b5aba05
          - sector: odd-v
            candidate_sha256: b772ab850121daf0bd85afd01e26fee9f72d14b940c4145ae7643734435f8967
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact convolution dependency
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Reassemble and verify hash-bound candidate and snapshot
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          sector='${{ matrix.sector }}'
          candidate_sha='${{ matrix.candidate_sha256 }}'
          candidate_root=Path('payloads/sandbox_wider_correction_v14_339')
          manifest=json.loads((candidate_root/'manifest.json').read_text())
          spec=manifest['buffers'][f'{sector}-wider-correction.bin']
          raw=base64.b64decode(b''.join((candidate_root/p).read_bytes() for p in spec['parts']),validate=True)
          assert len(raw)==spec['bytes']==4755456
          assert hashlib.sha256(raw).hexdigest()==spec['sha256']==candidate_sha
          target=Path('/tmp/wider-correction-input'); target.mkdir(parents=True,exist_ok=True)
          (target/f'{sector}-wider-correction.bin').write_bytes(raw)
          snapshot_root=Path('payloads/exact_outward_run_37827949740')
          snapshot_manifest=json.loads((snapshot_root/'artifact_manifest.json').read_text())
          snapshot=next(x for x in snapshot_manifest['snapshots'] if x['cutoff']==256000 and x['sector']==sector)
          raw=base64.b64decode(b''.join((snapshot_root/p).read_bytes() for p in snapshot['base64_parts']),validate=True)
          assert len(raw)==snapshot['bytes']
          assert hashlib.sha256(raw).hexdigest()==snapshot['sha256']
          (target/snapshot['snapshot_file']).write_bytes(raw)
          PY
      - name: Evaluate all 128000 physical finite-front RHS rows
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          mkdir -p '/tmp/wider-correction-rhs-${{ matrix.sector }}'
          python suzuki_wider_correction_rhs.py \
            --snapshot '/tmp/wider-correction-input/joint-256000-${{ matrix.sector }}.trace-256000.full.zip' \
            --old-root payloads/refined_near_trial_and_lift_v14_300 \
            --candidate '/tmp/wider-correction-input/${{ matrix.sector }}-wider-correction.bin' \
            --candidate-width 18 \
            --candidate-sha256 '${{ matrix.candidate_sha256 }}' \
            --sector '${{ matrix.sector }}' \
            --output-root '/tmp/wider-correction-rhs-${{ matrix.sector }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wider-correction-rhs-${{ matrix.sector }}
          path: /tmp/wider-correction-rhs-${{ matrix.sector }}
          if-no-files-found: error
