name: Suzuki M8000 mu1 far Gram outward budget

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_mu1_far_gram_outward_budget.py'
      - '.github/workflows/suzuki-M8000-mu1-far-gram-outward-budget.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run far Gram outward budget
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_mu1_far_gram_outward_budget.py | tee /tmp/M8000-mu1-far-gram-outward-budget.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-mu1-far-gram-outward-budget
          path: |
            /tmp/M8000-mu1-far-gram-outward-budget.txt
            unified/discriminant-12-return/research-notes/M8000_mu1_far_gram_outward_budget_result.json
