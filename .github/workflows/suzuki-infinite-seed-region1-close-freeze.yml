name: Freeze Suzuki infinite seed Region1 close action
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-infinite-seed-region1-close-freeze.yml
permissions:
  actions: read
  contents: write
jobs:
  freeze-exact-close-witnesses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: PrimeEuler/PrimeEuler.github.io
          run-id: 38301501247
          pattern: region1-close-*
          path: /tmp/region1-close
          merge-multiple: true
      - name: Verify and freeze exact Region1 close witnesses
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/region1-close')
          expected={
            'even-v':('abb858deb7344c99b578a7983b702e0c7207b1ce11ad899310fb054363ad7b59','551dab1fe43871db22630a9afad706f0c30ef71eb8c97b7fd8cb52bf2256dedb'),
            'odd-v':('1d290adc9d9b680b9c6ba0fb5483e90b4a0da6a399831fc25de333fc4e0087cf','dbf0caa2c9d841cb3417df463bfb99d19c07d9658a09f1deabe05e408d2e5271'),
          }
          for sector,(bsha,jsha) in expected.items():
            jp=root/f'region1-close-action-{sector}.json';rawj=jp.read_bytes()
            assert hashlib.sha256(rawj).hexdigest()==jsha
            cert=json.loads(rawj);bp=root/cert['point_buffer']['file'];rawb=bp.read_bytes()
            assert len(rawb)==cert['point_buffer']['bytes']==3840000
            assert hashlib.sha256(rawb).hexdigest()==cert['point_buffer']['sha256']==bsha
            assert cert['full_rectangle_evaluated'] and cert['output_count']==128000
          PY
          git fetch origin master
          git checkout -B master origin/master
          target=unified/discriminant-12-return/research-notes/payloads/infinite_seed_region1_close_action_v14_291
          mkdir -p "$target"
          cp /tmp/region1-close/even-v-region1-close-action.bin "$target/"
          cp /tmp/region1-close/odd-v-region1-close-action.bin "$target/"
          cp /tmp/region1-close/region1-close-action-even-v.json "$target/"
          cp /tmp/region1-close/region1-close-action-odd-v.json "$target/"
          git add "$target"
          if git diff --cached --quiet; then
            echo 'Exact Region1 close witnesses already frozen.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'cone: freeze v14.291 Region1 close witnesses'
            git push origin master
          fi
