name: Suzuki LDDD refined capacity bracket

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_ldd_refined_capacity_bracket.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_ldd_source_operator.py'
      - '.github/workflows/suzuki-ldd-refined-capacity-bracket.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run N192 LDDD refinement validation
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_ldd_refined_capacity_bracket.py --max-mode 192 --dps 180 --refinements 1 | tee /tmp/ldd-refined-capacity-bracket.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ldd-refined-capacity-bracket
          path: |
            /tmp/ldd-refined-capacity-bracket.txt
            unified/discriminant-12-return/research-notes/ldd_refined_capacity_bracket_result.json
