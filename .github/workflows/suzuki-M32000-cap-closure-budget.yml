name: Suzuki M32000 cap closure budget

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M32000_cap_closure_budget.py'
      - '.github/workflows/suzuki-M32000-cap-closure-budget.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run hardened cap-closure budget
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M32000_cap_closure_budget.py | tee /tmp/m32000-cap-closure.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m32000-cap-closure
          path: /tmp/m32000-cap-closure.txt
