name: Suzuki wider compact finite action
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-wider-compact-finite-action.yml
      - unified/discriminant-12-return/research-notes/suzuki_wider_compact_finite_action.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wider-compact-action:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact convolution dependency
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Reconstruct hash-bound actual256 witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil
          from pathlib import Path
          root=Path('payloads/exact_outward_run_37827949740')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for x in manifest['files']:
              raw=(root/x['file']).read_bytes()
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
          target=Path('/tmp/full-stationary-input');target.mkdir()
          for x in manifest['snapshots']:
              if x['cutoff']!=256000:continue
              raw=base64.b64decode(b''.join((root/p).read_bytes() for p in x['base64_parts']),validate=True)
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              (target/x['snapshot_file']).write_bytes(raw)
              shutil.copyfile(root/x['certificate_file'],target/x['certificate_file'])
          for short in ('even','odd'):
              for kind in ('moments','far'):
                  name=f'frozen256-{short}-{kind}.json'
                  shutil.copyfile(root/name,target/name)
          Path('/tmp/full-stationary-results').mkdir()
          PY
      - name: Reassemble and verify the supplied correction
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json
          from pathlib import Path
          root=Path('payloads/sandbox_wider_correction_v14_339')
          m=json.loads((root/'manifest.json').read_text())
          sector='${{ matrix.sector }}';name=f'{sector}-wider-correction.bin';spec=m['buffers'][name]
          raw=base64.b64decode(b''.join((root/p).read_bytes() for p in spec['parts']),validate=True)
          assert len(raw)==spec['bytes'] and hashlib.sha256(raw).hexdigest()==spec['sha256']
          (Path('/tmp/full-stationary-input')/name).write_bytes(raw)
          PY
      - name: Evaluate the complete 392192-row new compact action
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_wider_compact_finite_action.py --root /tmp/full-stationary-input --near-root payloads/refined_near_trial_and_lift_v14_300 --lift-root payloads/wider_correction_rhs_and_lift_v14_345 --source-root payloads/full_stationary_source_v14_213 --candidate-root /tmp/full-stationary-input --sector '${{ matrix.sector }}' --output-root '/tmp/wide-compact-${{ matrix.sector }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wider-compact-finite-action-${{ matrix.sector }}
          path: /tmp/wide-compact-${{ matrix.sector }}
          if-no-files-found: error
