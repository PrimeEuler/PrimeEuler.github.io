name: Suzuki P4 moment-cancelled re-Ritz replay

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_p4_moment_cancelled_reritz_replay.py'
      - '.github/workflows/suzuki-p4-moment-cancelled-reritz.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run M3 moment-cancelled re-Ritz replay
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_p4_moment_cancelled_reritz_replay.py | tee /tmp/p4-moment-cancelled-reritz.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p4-moment-cancelled-reritz
          path: |
            /tmp/p4-moment-cancelled-reritz.txt
            unified/discriminant-12-return/research-notes/p4_moment_cancelled_reritz_result.json
