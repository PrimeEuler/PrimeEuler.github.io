name: Suzuki refined Near compact action and residual
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-refined-near-region1.yml
      - unified/discriminant-12-return/research-notes/suzuki_refined_near_compact_region1_action.py
      - unified/discriminant-12-return/research-notes/suzuki_refined_near_region1_residual.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refined-region1:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact convolution dependency
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Reconstruct hash-bound actual256 witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil
          from pathlib import Path
          root=Path('payloads/exact_outward_run_37827949740')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for x in manifest['files']:
              raw=(root/x['file']).read_bytes()
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
          target=Path('/tmp/full-stationary-input');target.mkdir()
          for x in manifest['snapshots']:
              if x['cutoff']!=256000:continue
              raw=base64.b64decode(b''.join((root/p).read_bytes() for p in x['base64_parts']),validate=True)
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              (target/x['snapshot_file']).write_bytes(raw)
              shutil.copyfile(root/x['certificate_file'],target/x['certificate_file'])
          for short in ('even','odd'):
              for kind in ('moments','far'):
                  name=f'frozen256-{short}-{kind}.json'
                  shutil.copyfile(root/name,target/name)
          Path('/tmp/full-stationary-results').mkdir()
          PY
      - name: Evaluate the changed compact action and then the residual
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_refined_near_compact_region1_action.py --root /tmp/full-stationary-input --near-root payloads/refined_near_trial_and_lift_v14_300 --lift-root payloads/refined_near_trial_and_lift_v14_300 --source-root payloads/full_stationary_source_v14_213 --sector '${{ matrix.sector }}' --output-root /tmp/refined-region1
          python suzuki_refined_near_region1_residual.py --compact-root /tmp/refined-region1 --tail-root payloads/infinite_seed_region1_composed_action_v14_294 --lift-root payloads/refined_near_trial_and_lift_v14_300 --source-root payloads/full_stationary_source_v14_213 --sector '${{ matrix.sector }}' --output-root /tmp/refined-region1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-region1-${{ matrix.sector }}
          path: /tmp/refined-region1
          if-no-files-found: error

