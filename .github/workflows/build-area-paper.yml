name: Build Area Paper PDF

on:
  workflow_dispatch:
  push:
    paths:
      - 'unified/discriminant-12-return/foundations/Note_AreaDistortion_AMGM_Cone_v1.1.tex'
      - 'unified/discriminant-12-return/figures/paperA_area_measure_11_2panel.py'
      - 'unified/discriminant-12-return/foundations/build_area_paper.sh'
      - '.github/workflows/build-area-paper.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-matplotlib texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Build area paper
        run: bash unified/discriminant-12-return/foundations/build_area_paper.sh

      - name: Commit compiled outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unified/discriminant-12-return/foundations/Note_AreaDistortion_AMGM_Cone_v1.1.pdf
          git add unified/discriminant-12-return/figures/paperA_area_measure_11_2panel.png
          git add unified/discriminant-12-return/figures/paperA_area_measure_11_2panel.pdf
          if git diff --cached --quiet; then
            echo "Outputs unchanged"
          else
            git commit -m "Build area paper v1.1 outputs"
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin master
            git push
          fi
