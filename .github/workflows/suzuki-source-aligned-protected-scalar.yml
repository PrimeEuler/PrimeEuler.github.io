name: Suzuki source-aligned protected scalar

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_source_aligned_protected_scalar.py'
      - '.github/workflows/suzuki-source-aligned-protected-scalar.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run source-aligned scalar reduction
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_source_aligned_protected_scalar.py --max-mode 192 --dps 80 | tee /tmp/source-aligned-protected-scalar.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-aligned-protected-scalar
          path: |
            /tmp/source-aligned-protected-scalar.txt
            unified/discriminant-12-return/research-notes/source_aligned_protected_scalar_result.json
