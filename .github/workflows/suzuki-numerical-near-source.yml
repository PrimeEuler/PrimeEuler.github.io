name: Suzuki numerical near source replay
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/suzuki-numerical-near-source.yml'
      - 'unified/discriminant-12-return/research-notes/suzuki_numerical_near_source.py'
      - 'unified/discriminant-12-return/research-notes/payloads/numerical_near_source_v14_228/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  numerical-near-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact convolution dependency
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Reconstruct hash-bound actual256 witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil
          from pathlib import Path
          root=Path('payloads/exact_outward_run_37827949740')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for x in manifest['files']:
              raw=(root/x['file']).read_bytes()
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
          target=Path('/tmp/full-stationary-input');target.mkdir()
          for x in manifest['snapshots']:
              if x['cutoff']!=256000:continue
              raw=base64.b64decode(b''.join((root/p).read_bytes() for p in x['base64_parts']),validate=True)
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              (target/x['snapshot_file']).write_bytes(raw)
              shutil.copyfile(root/x['certificate_file'],target/x['certificate_file'])
          for short in ('even','odd'):
              for kind in ('moments','far'):
                  name=f'frozen256-{short}-{kind}.json'
                  shutil.copyfile(root/name,target/name)
          Path('/tmp/full-stationary-results').mkdir()
          PY
      - name: Reconstruct frozen near coefficients and verify their certificates
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          for sector in even-v odd-v; do
            python suzuki_near_source_channels.py \
              --root /tmp/full-stationary-input \
              --source-root payloads/full_stationary_source_v14_213 \
              --sector "$sector" --buffer-root /tmp/near-buffers \
              --output "/tmp/full-stationary-results/near-source-$sector.json"
            cmp "payloads/whole_affine_source_v14_223/near-source-$sector.json" "/tmp/full-stationary-results/near-source-$sector.json"
          done
      - name: Evaluate all 128000 physical near rows per parity and compare
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          for sector in even-v odd-v; do
            python suzuki_numerical_near_source.py \
              --cert-root payloads/whole_affine_source_v14_223 \
              --buffer-root /tmp/near-buffers \
              --source-root payloads/full_stationary_source_v14_213 \
              --sector "$sector" --output-root /tmp/numerical-near-results
            cmp "payloads/numerical_near_source_v14_228/numerical-near-source-$sector.json" "/tmp/numerical-near-results/numerical-near-source-$sector.json"
          done
      - name: Independently sum six complete direct-kernel rows
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_numerical_near_direct_checks.py \
            --root /tmp/full-stationary-input \
            --source-root payloads/full_stationary_source_v14_213 \
            --numerical-root /tmp/numerical-near-results \
            --output /tmp/numerical-near-results/direct-kernel-checks.json
          cmp payloads/numerical_near_source_v14_228/direct-kernel-checks.json /tmp/numerical-near-results/direct-kernel-checks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numerical-near-source-witnesses
          path: /tmp/numerical-near-results
          if-no-files-found: error
      - name: Freeze verified point witnesses additively
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B numerical-near-freeze origin/master
            echo "Archive base $(git rev-parse HEAD)"
            git ls-tree -r --name-only HEAD unified/discriminant-12-return/ledger | sort -V | tail -4 | while read path; do
              git show "HEAD:$path"
            done
            python - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          src=Path('/tmp/numerical-near-results')
          dst=Path('unified/discriminant-12-return/research-notes/payloads/numerical_near_witness_v14_228')
          files=[]
          for sector in ('even-v','odd-v'):
              certname=f'numerical-near-source-{sector}.json'
              cert=json.loads((src/certname).read_text())
              name=f'{sector}-rho-near.bin';raw=(src/name).read_bytes()
              assert len(raw)==cert['point_buffer']['bytes']
              assert hashlib.sha256(raw).hexdigest()==cert['point_buffer']['sha256']
              for filename in (certname,name):
                  b=(src/filename).read_bytes()
                  files.append({'file':filename,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'schema':'cone.frozen-numerical-near-witness.v1','source_commit':os.environ['SOURCE_COMMIT'],'files':files}
          blobs={r['file']:(src/r['file']).read_bytes() for r in files}
          blobs['manifest.json']=(json.dumps(manifest,indent=2,sort_keys=True)+'\n').encode()
          if dst.exists():
              assert {p.name for p in dst.iterdir()}==set(blobs),'archive collision'
              assert all((dst/name).read_bytes()==b for name,b in blobs.items()),'archive collision'
          else:
              dst.mkdir(parents=True)
              for name,b in blobs.items():(dst/name).write_bytes(b)
          PYCODE
            git add unified/discriminant-12-return/research-notes/payloads/numerical_near_witness_v14_228
            if git diff --cached --quiet; then
              echo 'Identical witness archive already frozen'
              exit 0
            fi
            git commit -m 'Freeze certified numerical near source witnesses v14.228'
            if git push origin HEAD:master; then exit 0; fi
          done
          echo 'Nonforced archive publication failed after three HEAD refreshes'
          exit 1
