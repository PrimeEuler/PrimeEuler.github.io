name: Suzuki nonoscillatory log tail replay
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-nonoscillatory-log-tail.yml
      - unified/discriminant-12-return/research-notes/suzuki_nonoscillatory_log_tail*.py
      - unified/discriminant-12-return/research-notes/payloads/nonoscillatory_log_tail_v14_259/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-nonoscillatory-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent reference dependency
        run: python -m pip install mpmath==1.3.0
      - name: Recompute directed nonoscillatory scalar primitives
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_nonoscillatory_log_tail.py --output /tmp/nonoscillatory-log-tail.json
          cmp payloads/nonoscillatory_log_tail_v14_259/nonoscillatory-log-tail.json /tmp/nonoscillatory-log-tail.json
      - name: Independent integral and derivative cross-checks
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_nonoscillatory_log_tail_reference.py --payload /tmp/nonoscillatory-log-tail.json --output /tmp/nonoscillatory-log-tail-reference.json
          cmp payloads/nonoscillatory_log_tail_v14_259/nonoscillatory-log-tail-reference.json /tmp/nonoscillatory-log-tail-reference.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonoscillatory-log-tail
          path: /tmp/nonoscillatory-log-tail.json
          if-no-files-found: error
