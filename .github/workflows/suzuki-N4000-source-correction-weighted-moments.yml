name: Suzuki N4000 source correction weighted moments

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N4000_source_correction_weighted_moments.py'
      - '.github/workflows/suzuki-N4000-source-correction-weighted-moments.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run weighted correction moments
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_N4000_source_correction_weighted_moments.py --sector ${{ matrix.sector }} | tee /tmp/corr-mom-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-correction-moments-${{ matrix.sector }}
          path: |
            /tmp/corr-mom-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/N4000_source_correction_weighted_moments_result.json
