name: Suzuki N4000 capacity residual energy arch200

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N4000_capacity_variational_residual_energy.py'
      - '.github/workflows/suzuki-N4000-capacity-residual-energy-arch200.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run correlated capacity residual energy at arch200
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_N4000_capacity_variational_residual_energy.py --sector ${{ matrix.sector }} --arch-terms 200 | tee /tmp/capacity-residual-arch200-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: capacity-residual-arch200-${{ matrix.sector }}
          path: |
            /tmp/capacity-residual-arch200-${{ matrix.sector }}.txt
            unified/discriminant-12-return/research-notes/N4000_capacity_variational_residual_energy_result.json
