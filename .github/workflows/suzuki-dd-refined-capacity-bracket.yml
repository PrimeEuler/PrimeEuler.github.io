name: Suzuki DD refined capacity bracket

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_dd_refined_capacity_bracket.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_doubledouble_source_operator.py'
      - '.github/workflows/suzuki-dd-refined-capacity-bracket.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run N192 DD refinement validation
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_dd_refined_capacity_bracket.py --max-mode 192 --dps 120 --refinements 1 | tee /tmp/dd-refined-capacity-bracket.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dd-refined-capacity-bracket
          path: |
            /tmp/dd-refined-capacity-bracket.txt
            unified/discriminant-12-return/research-notes/dd_refined_capacity_bracket_result.json
