name: Suzuki M8000 shell u-kernel LDDD

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_shell_u_kernel_ldd.py'
      - '.github/workflows/suzuki-M8000-shell-u-kernel-ldd.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run direct M8000 shell Schur kernel
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_shell_u_kernel_ldd.py | tee /tmp/M8000-shell-u-kernel.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-shell-u-kernel
          path: |
            /tmp/M8000-shell-u-kernel.txt
            unified/discriminant-12-return/research-notes/M8000_shell_u_kernel_ldd_result.json
