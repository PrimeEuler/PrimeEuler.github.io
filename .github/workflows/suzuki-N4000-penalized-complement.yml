name: Suzuki N4000 penalized complement

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N4000_penalized_cholesky_complement.py'
      - '.github/workflows/suzuki-N4000-penalized-complement.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run N4000 complement target
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_N4000_penalized_cholesky_complement.py | tee /tmp/N4000-complement.txt
      - uses: actions/upload-artifact@v4
        with:
          name: N4000-penalized-complement
          path: |
            /tmp/N4000-complement.txt
            unified/discriminant-12-return/research-notes/N4000_penalized_cholesky_complement_result.json
