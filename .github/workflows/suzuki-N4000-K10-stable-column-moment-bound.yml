name: Suzuki N4000 K10 stable column moment bound

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N4000_K10_stable_column_moment_bound.py'
      - '.github/workflows/suzuki-N4000-K10-stable-column-moment-bound.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run stable-column moment bound
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_N4000_K10_stable_column_moment_bound.py | tee /tmp/N4000-K10-stable-column-moment-bound.txt
      - uses: actions/upload-artifact@v4
        with:
          name: N4000-K10-stable-column-moment-bound
          path: |
            /tmp/N4000-K10-stable-column-moment-bound.txt
            unified/discriminant-12-return/research-notes/N4000_K10_stable_column_moment_bound_result.json
