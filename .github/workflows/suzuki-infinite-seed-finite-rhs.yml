name: Suzuki infinite seed finite RHS replay
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-infinite-seed-finite-rhs.yml
      - unified/discriminant-12-return/research-notes/suzuki_infinite_seed_finite_rhs.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  complete-finite-rhs-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct hash-bound actual256 witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil
          from pathlib import Path
          root=Path('payloads/exact_outward_run_37827949740')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for x in manifest['files']:
              raw=(root/x['file']).read_bytes()
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
          target=Path('/tmp/full-stationary-input');target.mkdir()
          for x in manifest['snapshots']:
              if x['cutoff']!=256000:continue
              raw=base64.b64decode(b''.join((root/p).read_bytes() for p in x['base64_parts']),validate=True)
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              (target/x['snapshot_file']).write_bytes(raw)
              shutil.copyfile(root/x['certificate_file'],target/x['certificate_file'])
          for short in ('even','odd'):
              for kind in ('moments','far'):
                  name=f'frozen256-{short}-{kind}.json'
                  shutil.copyfile(root/name,target/name)
          Path('/tmp/full-stationary-results').mkdir()
          PY
      - name: Assemble and byte-replay both complete RHS banks
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          mkdir -p /tmp/infinite-seed-rhs /tmp/infinite-seed-rhs-replay
          for sector in even-v odd-v; do
            for target in /tmp/infinite-seed-rhs /tmp/infinite-seed-rhs-replay; do
              python suzuki_infinite_seed_finite_rhs.py --root /tmp/full-stationary-input --near-root payloads/near_trial_rhs_witness_v14_238 --moment-root payloads/infinite_rhs_moments_v14_263 --source payloads/whole_affine_source_v14_223/whole-source-affine.json --sector "$sector" --output-root "$target"
            done
            cmp "payloads/infinite_seed_rhs_gate_v14_268/infinite-seed-finite-rhs-$sector.json" "/tmp/infinite-seed-rhs/infinite-seed-finite-rhs-$sector.json"
            cmp "/tmp/infinite-seed-rhs/infinite-seed-finite-rhs-$sector.json" "/tmp/infinite-seed-rhs-replay/infinite-seed-finite-rhs-$sector.json"
            cmp "/tmp/infinite-seed-rhs/$sector-infinite-seed-lift-rhs.bin" "/tmp/infinite-seed-rhs-replay/$sector-infinite-seed-lift-rhs.bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: infinite-seed-complete-finite-rhs
          path: /tmp/infinite-seed-rhs
          if-no-files-found: error
      - name: Freeze the verified RHS archive without forced writes
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B infinite-seed-rhs-freeze origin/master
            git ls-tree -r --name-only HEAD unified/discriminant-12-return/ledger | sort -V | tail -4 | while read path; do
              git show "HEAD:$path"
            done
            python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          src=Path('/tmp/infinite-seed-rhs')
          dst=Path('unified/discriminant-12-return/research-notes/payloads/infinite_seed_rhs_witness_v14_268')
          blobs={}
          for sector in ('even-v','odd-v'):
              name=f'infinite-seed-finite-rhs-{sector}.json'
              raw=(src/name).read_bytes();cert=json.loads(raw);blobs[name]=raw
              spec=cert['buffers']['lift-rhs'];data=(src/spec['file']).read_bytes()
              assert len(data)==spec['bytes'] and hashlib.sha256(data).hexdigest()==spec['sha256']
              blobs[spec['file']]=data
          manifest={'schema':'cone.frozen-infinite-seed-finite-rhs.v1','source_commit':os.environ['SOURCE_COMMIT'],'files':[{'file':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()} for name,raw in sorted(blobs.items())]}
          blobs['manifest.json']=(json.dumps(manifest,indent=2,sort_keys=True)+'\n').encode()
          if dst.exists():
              assert {p.name for p in dst.iterdir()}==set(blobs),'archive collision'
              assert all((dst/name).read_bytes()==raw for name,raw in blobs.items()),'archive collision'
          else:
              dst.mkdir(parents=True)
              for name,raw in blobs.items():(dst/name).write_bytes(raw)
          PY
            git add unified/discriminant-12-return/research-notes/payloads/infinite_seed_rhs_witness_v14_268
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Freeze complete infinite seed RHS witnesses v14.268'
            if git push origin HEAD:master; then exit 0; fi
          done
          exit 1

