name: M16001 Frobenius audit
on:
  pull_request:
    paths:
      - 'unified/discriminant-12-return/research-notes/**'
      - '.github/workflows/m16001-frobenius-audit.yml'
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy
      - name: Run orthonormal nullspace certificate
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_M16001_orthonormal_nullspace_certificate.py | tee /tmp/m16001-orthonormal.txt
      - name: Test exact P normalization
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_M16001_exact_P_normalization_test.py | tee /tmp/m16001-p-normalization.txt
      - name: Run orthonormal six-plane certificate
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_M16001_orthonormal_sixplane_certificate.py | tee /tmp/m16001-sixplane.txt
      - name: Run integrated outward replay
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_M16001_integrated_frobenius_replay.py | tee /tmp/m16001.txt
      - name: Run known primitive propagation
        working-directory: unified/discriminant-12-return/research-notes
        run: python run_m16001_primitive_propagation_ci.py | tee /tmp/m16001-primitive.txt
      - name: Run entrywise weighted displacement propagation
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_M16001_displacement_weighted_residual_radius.py | tee /tmp/m16001-weighted.txt
      - name: Run source payload conversion transcript
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_M16001_source_payload_conversion_transcript.py | tee /tmp/m16001-source-payload.txt
      - name: Run diag and X payload conversion transcript
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_M16001_diag_X_payload_conversion_transcript.py | tee /tmp/m16001-diag-x-payload.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m16001-frobenius-output
          path: |
            /tmp/m16001-orthonormal.txt
            /tmp/m16001-p-normalization.txt
            /tmp/m16001-sixplane.txt
            /tmp/m16001.txt
            /tmp/m16001-primitive.txt
            /tmp/m16001-weighted.txt
            /tmp/m16001-source-payload.txt
            /tmp/m16001-diag-x-payload.txt
