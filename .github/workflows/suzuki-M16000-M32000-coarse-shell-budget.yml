name: Suzuki 16k 32k coarse shell budget

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M16000_M32000_coarse_shell_budget.py'
      - '.github/workflows/suzuki-M16000-M32000-coarse-shell-budget.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run coarse shell target
        working-directory: unified/discriminant-12-return/research-notes
        run: python suzuki_M16000_M32000_coarse_shell_budget.py
