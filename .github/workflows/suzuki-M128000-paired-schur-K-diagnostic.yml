name: Suzuki M128000 paired Schur K diagnostic

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M128000_paired_schur_K_diagnostic.py'
      - '.github/workflows/suzuki-M128000-paired-schur-K-diagnostic.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run paired Schur K diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M128000_paired_schur_K_diagnostic.py --sector ${{ matrix.sector }} | tee /tmp/M128000-schur-K-${{ matrix.sector }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M128000-schur-K-${{ matrix.sector }}
          path: /tmp/M128000-schur-K-${{ matrix.sector }}.txt
