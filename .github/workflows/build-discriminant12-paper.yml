name: Build discriminant-12 principal paper

on:
  workflow_dispatch:
  push:
    paths:
      - 'unified/discriminant-12-return/papers/Discriminant_12_Return_v0.3.5.tex'
      - 'unified/discriminant-12-return/papers/build_discriminant12_v0.3.5.sh'
      - 'unified/discriminant-12-return/figures/discriminant12_tangent_null_rays_3panel.py'
      - 'unified/discriminant-12-return/figures/discriminant12_divisor_summatory_11_3panel.py'
      - 'unified/discriminant-12-return/figures/discriminant12_mod12_v4_cone_triple.py'
      - '.github/workflows/build-discriminant12-paper.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-matplotlib cm-super dvipng texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended

      - name: Build principal paper
        run: |
          bash unified/discriminant-12-return/papers/build_discriminant12_v0.3.5.sh
          cp unified/discriminant-12-return/papers/Discriminant_12_Return_v0.3.5.local-build.pdf \
             unified/discriminant-12-return/papers/Discriminant_12_Return_v0.3.5.pdf

      - name: Commit compiled outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add unified/discriminant-12-return/papers/Discriminant_12_Return_v0.3.5.pdf
          git add unified/discriminant-12-return/figures/discriminant12_tangent_null_rays_3panel.pdf
          git add unified/discriminant-12-return/figures/discriminant12_tangent_null_rays_3panel.png
          git add unified/discriminant-12-return/figures/discriminant12_divisor_summatory_11_3panel.pdf
          git add unified/discriminant-12-return/figures/discriminant12_divisor_summatory_11_3panel.png
          git add unified/discriminant-12-return/figures/mod12_v4_cone_triple.png
          if git diff --cached --quiet; then
            echo "Outputs unchanged"
          else
            git commit -m "Build Discriminant 12 Return v0.3.5 outputs"
            git pull --rebase origin master
            git push
          fi
