name: Suzuki N4000 actual source residual

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_N4000_actual_source_residual.py'
      - '.github/workflows/suzuki-N4000-actual-source-residual.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run actual source residual diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_N4000_actual_source_residual.py | tee /tmp/N4000-source-residual.txt
      - uses: actions/upload-artifact@v4
        with:
          name: N4000-source-residual
          path: |
            /tmp/N4000-source-residual.txt
            unified/discriminant-12-return/research-notes/N4000_actual_source_residual_result.json
