name: Suzuki M8000 mu1 penalized Cholesky gate

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_mu1_penalized_cholesky_gate.py'
      - '.github/workflows/suzuki-M8000-mu1-penalized-cholesky.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run penalized Cholesky complement gate
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_mu1_penalized_cholesky_gate.py | tee /tmp/M8000-mu1-penalized-cholesky.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-mu1-penalized-cholesky
          path: |
            /tmp/M8000-mu1-penalized-cholesky.txt
            unified/discriminant-12-return/research-notes/M8000_mu1_penalized_cholesky_gate_result.json
