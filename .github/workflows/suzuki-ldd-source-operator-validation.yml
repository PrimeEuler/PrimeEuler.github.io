name: Suzuki LDDD source operator validation

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_ldd_source_operator.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_ldd_source_operator_validation.py'
      - '.github/workflows/suzuki-ldd-source-operator-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Validate LDDD source operator at N192
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_ldd_source_operator_validation.py --max-mode 192 --dps 180 | tee /tmp/ldd-source-validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ldd-source-validation
          path: /tmp/ldd-source-validation.txt
