name: Suzuki protected six-plane capacity decomposition

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_protected_sixplane_capacity_decomposition.py'
      - '.github/workflows/suzuki-protected-sixplane-capacity.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run protected six-plane decomposition
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_protected_sixplane_capacity_decomposition.py --max-mode 192 --dps 80 | tee /tmp/protected-sixplane-capacity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: protected-sixplane-capacity
          path: |
            /tmp/protected-sixplane-capacity.txt
            unified/discriminant-12-return/research-notes/protected_sixplane_capacity_decomposition_result.json
