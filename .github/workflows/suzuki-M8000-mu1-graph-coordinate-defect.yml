name: Suzuki M8000 graph coordinate defect

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_mu1_graph_coordinate_defect.py'
      - '.github/workflows/suzuki-M8000-mu1-graph-coordinate-defect.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run graph coordinate defect diagnostic
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_mu1_graph_coordinate_defect.py | tee /tmp/M8000-graph-coordinate-defect.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M8000-graph-coordinate-defect
          path: |
            /tmp/M8000-graph-coordinate-defect.txt
            unified/discriminant-12-return/research-notes/M8000_mu1_graph_coordinate_defect_result.json
