name: Suzuki M8000 remote Schur rank sweep

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M8000_remote_schur_rank_sweep.py'
      - '.github/workflows/suzuki-M8000-remote-schur-rank-sweep.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
        rank: [32, 48, 64, 96]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run rank sweep point
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M8000_remote_schur_rank_sweep.py --sector ${{ matrix.sector }} --rank ${{ matrix.rank }} | tee /tmp/rank-${{ matrix.sector }}-${{ matrix.rank }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: remote-schur-rank-${{ matrix.sector }}-${{ matrix.rank }}
          path: |
            /tmp/rank-${{ matrix.sector }}-${{ matrix.rank }}.txt
            unified/discriminant-12-return/research-notes/M8000_remote_schur_rank_sweep_result.json
