name: Suzuki oscillatory log tail replay
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-oscillatory-log-tail.yml
      - unified/discriminant-12-return/research-notes/suzuki_oscillatory_log_tail.py
      - unified/discriminant-12-return/research-notes/payloads/oscillatory_log_tail_v14_255/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-oscillatory-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recompute directed oscillatory scalar primitives
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_oscillatory_log_tail.py --output /tmp/oscillatory-log-tail.json
          cmp payloads/oscillatory_log_tail_v14_255/oscillatory-log-tail.json /tmp/oscillatory-log-tail.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oscillatory-log-tail
          path: /tmp/oscillatory-log-tail.json
          if-no-files-found: error
