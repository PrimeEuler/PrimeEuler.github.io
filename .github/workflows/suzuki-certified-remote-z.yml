name: Suzuki certified remote scalar replay
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/suzuki-certified-remote-z.yml'
      - 'unified/discriminant-12-return/research-notes/suzuki_certified_remote_z.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_certified_remote_z_gate.py'
      - 'unified/discriminant-12-return/research-notes/payloads/certified_remote_z_v14_227/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certified-scalar-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent diagnostic dependency
        run: python -m pip install mpmath==1.3.0
      - name: Exact interval evaluator, independent diagnostics and source budget
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_certified_remote_z_gate.py \
            --source payloads/whole_affine_source_v14_223/whole-source-affine.json \
            --output /tmp/certified-remote-z-gate.json
          cmp payloads/certified_remote_z_v14_227/certified-remote-z-gate.json /tmp/certified-remote-z-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-remote-z-replay
          path: /tmp/certified-remote-z-gate.json
          if-no-files-found: error
