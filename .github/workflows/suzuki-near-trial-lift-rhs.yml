name: Suzuki new near trial finite lift RHS replay
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/suzuki-near-trial-lift-rhs.yml'
      - 'unified/discriminant-12-return/research-notes/suzuki_near_trial_lift_rhs.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_bulk_action_z*.py'
      - 'unified/discriminant-12-return/research-notes/payloads/new_near_trial_rhs_v14_238/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  new-near-trial-rhs-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent reference dependency
        run: python -m pip install mpmath==1.3.0
      - name: Install exact convolution dependency
        run: sudo apt-get update && sudo apt-get install -y libgmp10
      - name: Reconstruct hash-bound actual256 witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil
          from pathlib import Path
          root=Path('payloads/exact_outward_run_37827949740')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for x in manifest['files']:
              raw=(root/x['file']).read_bytes()
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
          target=Path('/tmp/full-stationary-input');target.mkdir()
          for x in manifest['snapshots']:
              if x['cutoff']!=256000:continue
              raw=base64.b64decode(b''.join((root/p).read_bytes() for p in x['base64_parts']),validate=True)
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              (target/x['snapshot_file']).write_bytes(raw)
              shutil.copyfile(root/x['certificate_file'],target/x['certificate_file'])
          for short in ('even','odd'):
              for kind in ('moments','far'):
                  name=f'frozen256-{short}-{kind}.json'
                  shutil.copyfile(root/name,target/name)
          Path('/tmp/full-stationary-results').mkdir()
          PY
      - name: Reuse immutable numerical near witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PYCODE'
          import json,hashlib
          from pathlib import Path
          root=Path('payloads/numerical_near_witness_v14_228')
          m=json.loads((root/'manifest.json').read_text())
          for r in m['files']:
              b=(root/r['file']).read_bytes()
              assert len(b)==r['bytes'] and hashlib.sha256(b).hexdigest()==r['sha256']
          PYCODE
      - name: Bulk path reproduces the original full physical action certificate
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          mkdir -p /tmp/new-near-trial-rhs
          python suzuki_bulk_action_z_gate.py \
            --source-gate payloads/certified_remote_z_v14_227/certified-remote-z-gate.json \
            --action-gate payloads/action_precision_z_v14_229/action-precision-z-gate.json \
            --output /tmp/new-near-trial-rhs/bulk-action-z-gate.json
          cmp payloads/new_near_trial_rhs_v14_238/bulk-action-z-gate.json /tmp/new-near-trial-rhs/bulk-action-z-gate.json
      - name: Evaluate both complete new trial-dependent finite RHS blocks
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          for sector in even-v odd-v; do
            python suzuki_near_trial_lift_rhs.py \
              --root /tmp/full-stationary-input \
              --numerical-root payloads/numerical_near_witness_v14_228 \
              --sector "$sector" --output-root /tmp/new-near-trial-rhs
            cmp "payloads/new_near_trial_rhs_v14_238/new-near-trial-rhs-$sector.json" "/tmp/new-near-trial-rhs/new-near-trial-rhs-$sector.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-near-trial-lift-rhs
          path: /tmp/new-near-trial-rhs
          if-no-files-found: error
      - name: Freeze verified new trial and finite RHS witnesses additively
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin master
            git checkout -B new-near-trial-rhs-freeze origin/master
            echo "Archive base $(git rev-parse HEAD)"
            git ls-tree -r --name-only HEAD unified/discriminant-12-return/ledger | sort -V | tail -4 | while read path; do
              git show "HEAD:$path"
            done
            python - <<'PYCODE'
          import hashlib,json,os
          from pathlib import Path
          src=Path('/tmp/new-near-trial-rhs')
          dst=Path('unified/discriminant-12-return/research-notes/payloads/near_trial_rhs_witness_v14_238')
          files=[]
          for sector in ('even-v','odd-v'):
              certname=f'new-near-trial-rhs-{sector}.json'
              cert=json.loads((src/certname).read_text())
              names=[certname]
              for spec in cert['buffers'].values():
                  name=spec['file'];raw=(src/name).read_bytes()
                  assert len(raw)==spec['bytes'] and hashlib.sha256(raw).hexdigest()==spec['sha256']
                  names.append(name)
              for filename in names:
                  raw=(src/filename).read_bytes()
                  files.append({'file':filename,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          raw=(src/'bulk-action-z-gate.json').read_bytes()
          files.append({'file':'bulk-action-z-gate.json','bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          manifest={'schema':'cone.frozen-new-near-trial-lift-rhs.v1','source_commit':os.environ['SOURCE_COMMIT'],'files':files}
          blobs={r['file']:(src/r['file']).read_bytes() for r in files}
          blobs['manifest.json']=(json.dumps(manifest,indent=2,sort_keys=True)+'\n').encode()
          if dst.exists():
              assert {p.name for p in dst.iterdir()}==set(blobs),'archive collision'
              assert all((dst/name).read_bytes()==b for name,b in blobs.items()),'archive collision'
          else:
              dst.mkdir(parents=True)
              for name,b in blobs.items():(dst/name).write_bytes(b)
          PYCODE
            git add unified/discriminant-12-return/research-notes/payloads/near_trial_rhs_witness_v14_238
            if git diff --cached --quiet; then
              echo 'Identical witness archive already frozen'
              exit 0
            fi
            git commit -m 'Freeze certified new near trial and finite lift RHS v14.238'
            if git push origin HEAD:master; then exit 0; fi
          done
          echo 'Nonforced archive publication failed after three HEAD refreshes'
          exit 1
