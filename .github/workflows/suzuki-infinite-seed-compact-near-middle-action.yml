name: Suzuki infinite seed compact Near Middle action replay
on:
  push:
    branches: [master]
    paths:
      - .github/workflows/suzuki-infinite-seed-compact-near-middle-action.yml
      - unified/discriminant-12-return/research-notes/suzuki_infinite_seed_compact_near_middle_action.py
      - unified/discriminant-12-return/research-notes/payloads/infinite_seed_compact_near_middle_v14_285/*.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exact-near-middle-replay:
    strategy:
      fail-fast: false
      matrix:
        sector: [even-v, odd-v]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reconstruct hash-bound actual256 witness
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import base64,hashlib,json,shutil
          from pathlib import Path
          root=Path('payloads/exact_outward_run_37827949740')
          manifest=json.loads((root/'artifact_manifest.json').read_text())
          for x in manifest['files']:
              raw=(root/x['file']).read_bytes()
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
          target=Path('/tmp/full-stationary-input');target.mkdir()
          for x in manifest['snapshots']:
              if x['cutoff']!=256000:continue
              raw=base64.b64decode(b''.join((root/p).read_bytes() for p in x['base64_parts']),validate=True)
              assert len(raw)==x['bytes'] and hashlib.sha256(raw).hexdigest()==x['sha256']
              (target/x['snapshot_file']).write_bytes(raw)
              shutil.copyfile(root/x['certificate_file'],target/x['certificate_file'])
          PY
      - name: Recompute every compact Near and Middle row
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          mkdir -p /tmp/compact-near-middle
          python suzuki_infinite_seed_compact_near_middle_action.py \
            --root /tmp/full-stationary-input \
            --near-root payloads/near_trial_rhs_witness_v14_238 \
            --lift-root payloads/infinite_seed_finite_lift_witness_v14_269 \
            --source-root payloads/full_stationary_source_v14_213 \
            --sector "${{ matrix.sector }}" \
            --output-root /tmp/compact-near-middle
          cmp "payloads/infinite_seed_compact_near_middle_v14_285/infinite-seed-compact-near-middle-${{ matrix.sector }}.json" "/tmp/compact-near-middle/infinite-seed-compact-near-middle-${{ matrix.sector }}.json"
          python - "${{ matrix.sector }}" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          sector=sys.argv[1];root=Path('/tmp/compact-near-middle')
          cert=json.loads((root/f'infinite-seed-compact-near-middle-{sector}.json').read_text())
          raw=(root/cert['buffer']['file']).read_bytes()
          assert len(raw)==cert['buffer']['bytes']
          assert hashlib.sha256(raw).hexdigest()==cert['buffer']['sha256']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-near-middle-${{ matrix.sector }}
          path: /tmp/compact-near-middle
          if-no-files-found: error
  freeze-exact-row-buffers:
    needs: exact-near-middle-replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: compact-near-middle-*
          path: /tmp/compact-near-middle
          merge-multiple: true
      - name: Verify and freeze exact row witnesses
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          artifact=Path('/tmp/compact-near-middle')
          committed=Path('payloads/infinite_seed_compact_near_middle_v14_285')
          for sector in ('even-v','odd-v'):
              cert=json.loads((committed/f'infinite-seed-compact-near-middle-{sector}.json').read_text())
              raw=(artifact/cert['buffer']['file']).read_bytes()
              assert len(raw)==cert['buffer']['bytes']
              assert hashlib.sha256(raw).hexdigest()==cert['buffer']['sha256']
          PY
          git fetch origin master
          git checkout -B master origin/master
          target=payloads/infinite_seed_compact_near_middle_v14_285
          for sector in even-v odd-v; do
            file="$sector-compact-near-middle-action.bin"
            if test -f "$target/$file"; then
              cmp "$target/$file" "/tmp/compact-near-middle/$file"
            else
              cp "/tmp/compact-near-middle/$file" "$target/$file"
              git add "$target/$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "Exact row buffers already frozen byte-for-byte."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "cone: freeze v14.285 compact Near Middle rows"
            git push origin master
          fi
