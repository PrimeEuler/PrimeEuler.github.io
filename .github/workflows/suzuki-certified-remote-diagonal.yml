name: Suzuki certified raw remote diagonal replay
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/suzuki-certified-remote-diagonal.yml'
      - 'unified/discriminant-12-return/research-notes/suzuki_certified_remote_diagonal*.py'
      - 'unified/discriminant-12-return/research-notes/suzuki_certified_remote_z.py'
      - 'unified/discriminant-12-return/research-notes/payloads/certified_remote_diagonal_v14_235/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raw-diagonal-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent reference dependency
        run: python -m pip install mpmath==1.3.0
      - name: Replay raw physical diagonal and uniform budget
        working-directory: unified/discriminant-12-return/research-notes
        run: |
          python suzuki_certified_remote_diagonal_gate.py \
            --source-gate payloads/certified_remote_z_v14_227/certified-remote-z-gate.json \
            --output /tmp/certified-remote-diagonal-gate.json
          cmp payloads/certified_remote_diagonal_v14_235/certified-remote-diagonal-gate.json /tmp/certified-remote-diagonal-gate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-remote-diagonal-replay
          path: /tmp/certified-remote-diagonal-gate.json
          if-no-files-found: error
