name: Suzuki M16000 scalar interval audit arch200

on:
  push:
    branches: [ master ]
    paths:
      - 'unified/discriminant-12-return/research-notes/suzuki_M16000_scalar_interval_audit_arch200.py'
      - '.github/workflows/suzuki-M16000-scalar-interval-audit-arch200.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy mpmath
      - name: Run M16000 arch200 scalar interval audit
        working-directory: unified/discriminant-12-return/research-notes
        shell: bash
        run: |
          set -o pipefail
          python suzuki_M16000_scalar_interval_audit_arch200.py | tee /tmp/M16000-arch200-scalar-audit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: M16000-arch200-scalar-audit
          path: |
            /tmp/M16000-arch200-scalar-audit.txt
            unified/discriminant-12-return/research-notes/M16000_scalar_interval_audit_arch200_result.json
